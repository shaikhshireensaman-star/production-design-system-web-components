name: Release readiness (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @production-design-system/components pack --dry-run
      - run: pnpm --filter @production-design-system/tokens pack --dry-run
